<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12101C" />
      <stop offset="100%" stop-color="#090811" />
    </linearGradient>

    <!-- Violet/Pink Accent Gradient -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EC4899" />
      <stop offset="50%" stop-color="#A78BFA" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>

    <!-- Download Wave Gradient -->
    <linearGradient id="downloadGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.1" />
    </linearGradient>

    <!-- Upload Wave Gradient -->
    <linearGradient id="uploadGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#EC4899" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0.1" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="violetGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Card -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGrad)" stroke="#29243A" stroke-width="8" />

  <!-- Background Pulse Rings -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="#29243A" stroke-width="2" stroke-dasharray="8 8" opacity="0.6" />
  <circle cx="256" cy="256" r="120" fill="none" stroke="#29243A" stroke-width="2" opacity="0.4" />

  <!-- Graph Waves (Download & Upload Area) -->
  <path d="M 80 340 Q 140 310 200 240 T 320 280 T 432 190 L 432 370 L 80 370 Z" fill="url(#downloadGrad)" />
  <path d="M 80 340 Q 140 310 200 240 T 320 280 T 432 190" fill="none" stroke="#A78BFA" stroke-width="6" stroke-linecap="round" filter="url(#violetGlow)" />

  <path d="M 80 380 Q 150 350 220 320 T 340 220 T 432 260" fill="none" stroke="#EC4899" stroke-width="5" stroke-linecap="round" stroke-dasharray="4 6" opacity="0.85" />

  <!-- Network Node Hexagon / Diamond Core -->
  <g transform="translate(256, 170)">
    <!-- Central Node -->
    <circle cx="0" cy="0" r="28" fill="#12101C" stroke="url(#primaryGrad)" stroke-width="6" />
    <circle cx="0" cy="0" r="12" fill="#A78BFA" />

    <!-- Node connections -->
    <line x1="-80" y1="30" x2="-26" y2="10" stroke="#A78BFA" stroke-width="3" opacity="0.7" />
    <circle cx="-80" cy="30" r="10" fill="#1A1728" stroke="#A78BFA" stroke-width="3" />

    <line x1="80" y1="20" x2="26" y2="8" stroke="#EC4899" stroke-width="3" opacity="0.7" />
    <circle cx="80" cy="20" r="9" fill="#1A1728" stroke="#EC4899" stroke-width="3" />

    <line x1="0" y1="-70" x2="0" y2="-28" stroke="#A78BFA" stroke-width="3" stroke-dasharray="4 4" opacity="0.6" />
    <circle cx="0" cy="-70" r="8" fill="#1A1728" stroke="#34D399" stroke-width="3" />
  </g>

  <!-- Speed Indicators -->
  <!-- Download Arrow -->
  <g transform="translate(140, 410)">
    <circle cx="0" cy="0" r="18" fill="#1A1728" stroke="#A78BFA" stroke-width="2" />
    <path d="M 0 -8 L 0 8 M -5 3 L 0 8 L 5 3" fill="none" stroke="#A78BFA" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Upload Arrow -->
  <g transform="translate(372, 410)">
    <circle cx="0" cy="0" r="18" fill="#1A1728" stroke="#EC4899" stroke-width="2" />
    <path d="M 0 8 L 0 -8 M -5 -3 L 0 -8 L 5 -3" fill="none" stroke="#EC4899" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>

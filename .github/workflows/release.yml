name: Release Build & Packaging

on:
  push:
    tags:
      - 'v*'

jobs:
  build-release:
    name: Build Linux Bundles (RPM, AppImage, tar.gz)
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev librsvg2-dev rpm

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build Tauri Desktop Application & Bundles
        run: |
          cd frontend
          pnpm tauri build --bundles rpm,appimage,deb

      - name: Package tar.gz binary release
        run: |
          mkdir -p dist-archive/linux-traffic-manager
          cp target/release/linux-traffic-manager dist-archive/linux-traffic-manager/ || true
          cp README.md LICENSE dist-archive/linux-traffic-manager/
          tar -czvf linux-traffic-manager-x86_64.tar.gz -C dist-archive linux-traffic-manager

      - name: Generate Checksums
        run: |
          sha256sum linux-traffic-manager-x86_64.tar.gz > SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            linux-traffic-manager-x86_64.tar.gz
            SHA256SUMS.txt
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
          draft: false
          prerelease: false
          generate_release_notes: true

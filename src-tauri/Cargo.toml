[package]
name = "linux-traffic-manager"
version = "0.2.0"
description = "Linux Traffic Manager - Understand your network"
authors = ["Linux Traffic Manager Contributors"]
license = "MIT"
edition = "2021"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
ltm-core = { path = "../crates/ltm-core" }
tauri = { version = "2", features = ["custom-protocol"] }
tauri-plugin-opener = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1.40", features = ["full"] }
log = "0.4"
env_logger = "0.11"

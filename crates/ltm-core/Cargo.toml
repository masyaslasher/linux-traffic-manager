[package]
name = "ltm-core"
version = "0.1.0"
edition = "2021"
authors = ["Linux Traffic Manager Contributors"]
description = "Core network monitoring, socket discovery, procfs parsers, and SQLite storage for Linux Traffic Manager"
license = "MIT"

[dependencies]
tokio = { version = "1.40", features = ["rt-multi-thread", "time", "sync", "macros", "net", "io-util"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2.0"
log = "0.4"
env_logger = "0.11"
libc = "0.2"

[dev-dependencies]
tempfile = "3.13"
